<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Client2Freelancer — trustless USDC escrow payments on Arc Network. Create, cancel, dispute, and resolve escrows on-chain."
    />
    <meta name="theme-color" content="#0a0b0d" />
    <title>Client2Freelancer — Secure USDC Escrow Platform</title>
    <script>
      // On mobile browsers, "Desktop site" / "Request Desktop Website" mode
      // usually widens the layout viewport — but on some phones it does not
      // (iOS Safari and narrow Android Chrome keep width=device-width), so
      // the mobile CSS + hamburger drawer stays active and the desktop UI
      // never shows. Detect that case and force a 1920px desktop layout
      // viewport so the real desktop layout (sidebar, no hamburger) renders.
      // Normal mobile and real desktop are never touched.
      (function () {
        try {
          // A phone: touch capable + CSS screen width (physical / DPR) <= 600.
          var dpr = window.devicePixelRatio || 1;
          var cssScreen = window.screen ? window.screen.width / dpr : 0;
          var touchPhone =
            (navigator.maxTouchPoints || 0) > 0 &&
            cssScreen > 0 &&
            cssScreen <= 600;
          if (!touchPhone) return;

          // Desktop mode on the phone: the layout viewport is already wide
          // (Android Chrome: ~980px+) OR the UA claims a desktop OS.
          var ua = navigator.userAgent;
          var desktopUA =
            /Macintosh|Windows NT|X11|Linux/.test(ua) &&
            !/Mobile|Android|iPhone|iPad|iPod/.test(ua);
          var alreadyWide = window.innerWidth > 700;
          if (!desktopUA && !alreadyWide) return;

          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute("content", "width=1920, initial-scale=1");
        } catch (e) {
          /* never block first paint */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
