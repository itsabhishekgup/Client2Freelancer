<!doctype html>

    />

    <title>Client2Freelancer — Secure USDC Escrow Platform</title>
    <script>
      // Detect a REAL touch phone independently of the layout viewport width.
      // Chrome/Safari "Desktop site" mode widens the viewport to ~980px (so
      // max-width breakpoints stop matching), but it does NOT change
      // navigator.maxTouchPoints or window.screen.width. Flag such phones on
      // <html> so the React nav + mobile CSS keep the mobile UI. Real
      // desktop/laptop never matches (no coarse touch and/or a wide screen),
      // so its layout is completely untouched.
      (function () {
        try {
          var touch =
            (navigator.maxTouchPoints || 0) > 0 || "ontouchstart" in window;
          var screenW = window.screen ? window.screen.width : 0;
          var mobileUA = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile/i.test(
            navigator.userAgent || "",
          );
          if (touch && (screenW <= 600 || mobileUA)) {
            document.documentElement.classList.add("is-mobile-device");
          }
        } catch (e) {
          /* never block first paint */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
